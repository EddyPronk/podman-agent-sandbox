name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.12', '22', '24']   # 20.12 is the minimum in package.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm pack
      - name: Check the tarball's contents
        run: |
          tar -tzf podman-agent-sandbox-*.tgz | tee files.txt
          grep -qx 'package/templates/claude/.devcontainer/devcontainer.json' files.txt
          grep -qx 'package/templates/claude-containers/.devcontainer/seccomp.json' files.txt
          ! grep -q '^package/test/' files.txt
      - name: Install the tarball and run sandbox
        run: |
          npm install -g ./podman-agent-sandbox-*.tgz
          sandbox --help
          sandbox templates | grep -q '^claude'
          sandbox templates | grep -q '^claude-containers'
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: podman-agent-sandbox-*.tgz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # for the attestation's signing certificate (Sigstore)
      attestations: write   # to store it with the repository
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tarball
      # A signed statement that this workflow, at this tag's commit, built the tarball: checked with
      # `gh attestation verify` (INSTALL.md). Before the release, so every release has one. It
      # covers the copy under the fixed name too: attestations are by the file's digest.
      # Pinned by commit, not by tag: this step can sign as us, and a tag can be moved.
      - name: Attest the tarball's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: podman-agent-sandbox-*.tgz
      - name: Create the GitHub release with the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        # Also under a fixed name: releases/latest/download/podman-agent-sandbox.tgz then always serves
        # the latest release, which is what install.sh downloads.
        run: |
          cp podman-agent-sandbox-*.tgz podman-agent-sandbox.tgz
          gh release create "$GITHUB_REF_NAME" podman-agent-sandbox-*.tgz podman-agent-sandbox.tgz \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
